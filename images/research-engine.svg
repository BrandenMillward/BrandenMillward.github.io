<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Seven agent nodes fanning out from one input and merging into a single report">


  <g stroke="#6b7391" stroke-width="1" opacity="0.9">
    <line x1="110" y1="180" x2="300" y2="45"/>
    <line x1="110" y1="180" x2="300" y2="90"/>
    <line x1="110" y1="180" x2="300" y2="135"/>
    <line x1="110" y1="180" x2="300" y2="180"/>
    <line x1="110" y1="180" x2="300" y2="225"/>
    <line x1="110" y1="180" x2="300" y2="270"/>
    <line x1="110" y1="180" x2="300" y2="315"/>
    <line x1="300" y1="45" x2="500" y2="180"/>
    <line x1="300" y1="90" x2="500" y2="180"/>
    <line x1="300" y1="135" x2="500" y2="180"/>
    <line x1="300" y1="180" x2="500" y2="180"/>
    <line x1="300" y1="225" x2="500" y2="180"/>
    <line x1="300" y1="270" x2="500" y2="180"/>
    <line x1="300" y1="315" x2="500" y2="180"/>
