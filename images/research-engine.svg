<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Seven agent nodes fanning out from one input and merging into a single report">

  <style>
    /* Connectors stay solid. A duplicate stroke rides over each one as a row of
       round dots, and the output ring pings as they arrive. Decoration only:
       the diagram reads the same with both removed. */
    .pulse, .pulse * {
      fill: none;
      stroke: #696fb4;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 0 48;
      opacity: 1;
      animation: stream 1.6s linear infinite;
    }
    .ping {
      transform-box: fill-box;
      transform-origin: center;
      animation: ping 1.6s ease-out infinite;
    }
    @keyframes stream { to { stroke-dashoffset: -48; } }
    @keyframes ping {
      0%   { transform: scale(1); opacity: 0.55; }
      70%  { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .ping { display: none; }
    }
  </style>

  <g stroke="#6b7391" stroke-width="1" opacity="0.9">
    <line x1="110" y1="180" x2="300" y2="45"/>
    <line x1="110" y1="180" x2="300" y2="90"/>
    <line x1="110" y1="180" x2="300" y2="135"/>
    <line x1="110" y1="180" x2="300" y2="180"/>
    <line x1="110" y1="180" x2="300" y2="225"/>
    <line x1="110" y1="180" x2="300" y2="270"/>
    <line x1="110" y1="180" x2="300" y2="315"/>
    <line x1="300" y1="45" x2="500" y2="180"/>
    <line x1="300" y1="90" x2="500" y2="180"/>
    <line x1="300" y1="135" x2="500" y2="180"/>
    <line x1="300" y1="180" x2="500" y2="180"/>
    <line x1="300" y1="225" x2="500" y2="180"/>
    <line x1="300" y1="270" x2="500" y2="180"/>
    <line x1="300" y1="315" x2="500" y2="180"/>
  </g>
<g class="pulse" stroke="#6b7391" stroke-width="1" opacity="0.9">
    <line x1="110" y1="180" x2="300" y2="45"/>
    <line x1="110" y1="180" x2="300" y2="90"/>
    <line x1="110" y1="180" x2="300" y2="135"/>
    <line x1="110" y1="180" x2="300" y2="180"/>
    <line x1="110" y1="180" x2="300" y2="225"/>
    <line x1="110" y1="180" x2="300" y2="270"/>
    <line x1="110" y1="180" x2="300" y2="315"/>
    <line x1="300" y1="45" x2="500" y2="180"/>
    <line x1="300" y1="90" x2="500" y2="180"/>
    <line x1="300" y1="135" x2="500" y2="180"/>
    <line x1="300" y1="180" x2="500" y2="180"/>
    <line x1="300" y1="225" x2="500" y2="180"/>
    <line x1="300" y1="270" x2="500" y2="180"/>
    <line x1="300" y1="315" x2="500" y2="180"/>
  </g>

  <circle cx="110" cy="180" r="10" fill="#696fb4"/>

  <g fill="#696fb4" opacity="0.85">
    <circle cx="300" cy="45" r="7"/>
    <circle cx="300" cy="90" r="7"/>
    <circle cx="300" cy="135" r="7"/>
    <circle cx="300" cy="180" r="7"/>
    <circle cx="300" cy="225" r="7"/>
    <circle cx="300" cy="270" r="7"/>
    <circle cx="300" cy="315" r="7"/>
  </g>

  <circle cx="500" cy="180" r="12" fill="none" stroke="#696fb4" stroke-width="2"/>
  <circle class="ping" cx="500" cy="180" r="12" fill="none" stroke="#696fb4" stroke-width="2"/>
  <circle cx="500" cy="180" r="5" fill="#696fb4"/>
  <g stroke="#696fb4" stroke-width="2" opacity="0.7" stroke-linecap="round">
    <line x1="545" y1="150" x2="600" y2="150"/>
    <line x1="545" y1="170" x2="590" y2="170"/>
    <line x1="545" y1="190" x2="600" y2="190"/>
    <line x1="545" y1="210" x2="580" y2="210"/>
  </g>
</svg>
