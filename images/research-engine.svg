    <circle cx="300" cy="90" r="7"/>
    <circle cx="300" cy="135" r="7"/>
    <circle cx="300" cy="180" r="7"/>
    <circle cx="300" cy="225" r="7"/>
    <circle cx="300" cy="270" r="7"/>
    <circle cx="300" cy="315" r="7"/>
  </g>

  <circle cx="500" cy="180" r="12" fill="none" stroke="#696fb4" stroke-width="2"/>
  <circle cx="500" cy="180" r="5" fill="#696fb4"/>
  <g stroke="#696fb4" stroke-width="2" opacity="0.7" stroke-linecap="round">
    <line x1="545" y1="150" x2="600" y2="150"/>
    <line x1="545" y1="170" x2="590" y2="170"/>
    <line x1="545" y1="190" x2="600" y2="190"/>
    <line x1="545" y1="210" x2="580" y2="210"/>
