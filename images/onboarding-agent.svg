<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="A sequence of onboarding steps passing through an approval gate, with a rework loop returning to the drafting step">

  <!-- The draft reaches the gate and is sent back, loops to drafting, returns, passes, and completes. -->
  <style>
    /* Motion is decoration: under reduced motion every rule below switches off and the
       diagram is exactly as authored. Generated by scripts/animate-covers.js, edit there.
       .pkt    a streak riding a duplicate of a connector (pathLength=100)
       .emit   source winds up, then releases
       .pop    node reacts as a packet lands (.pop-s for large shapes)
       .ping   copy of an output ring that expands and fades
       .write  stroke redraws left to right (pathLength=100)
       .shake  a flagged gap
       .spin   one eased turn, origin set inline
       .breathe ambient, the only part with no delay */
    .pkt {
      fill: none; stroke: #696fb4; stroke-width: 4; stroke-linecap: round;
      stroke-dasharray: 0 200; opacity: 0;
      animation: hop 7.2s var(--d, 0s) infinite both;
    }
    .pkt.l { animation-name: hop-l; }
    .emit, .pop, .pop-s, .ping, .shake { transform-box: fill-box; transform-origin: center; }
    .emit  { animation: emit 7.2s var(--d, 0s) infinite both; }
    .pop   { animation: pop 7.2s var(--d, 0s) infinite both; }
    .pop-s { animation: pop-s 7.2s var(--d, 0s) infinite both; }
    .ping  { opacity: 0; animation: ping 7.2s var(--d, 0s) infinite both; }
    .write { stroke-dasharray: 100 100; animation: write 7.2s var(--d, 0s) infinite both; }
    .shake { animation: shake 7.2s var(--d, 0s) infinite both; }
    .spin  { transform-box: view-box; animation: spin 7.2s var(--d, 0s) infinite both; }
    .breathe { animation: breathe 7.2s ease-in-out infinite; }
    
    @keyframes hop {
      0%       { stroke-dasharray: 0 200; stroke-dashoffset: 0; opacity: 0; animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      0.28% { opacity: 1; }
      2.5% { stroke-dasharray: 30 200; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      8.33% { stroke-dasharray: 30 200; stroke-dashoffset: -70; opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      10.56%, 100% { stroke-dasharray: 0 200; stroke-dashoffset: -100; opacity: 0; }
    }
    
    @keyframes hop-l {
      0%       { stroke-dasharray: 0 200; stroke-dashoffset: 0; opacity: 0; animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      0.28% { opacity: 1; }
      3.33% { stroke-dasharray: 30 200; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      11.11% { stroke-dasharray: 30 200; stroke-dashoffset: -70; opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      13.33%, 100% { stroke-dasharray: 0 200; stroke-dashoffset: -100; opacity: 0; }
    }
    @keyframes emit {
      0%        { transform: scale(1); animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      3.33% { transform: scale(0.85); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      5.83% { transform: scale(1.15); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      9.72%, 100% { transform: scale(1); }
    }
    @keyframes pop {
      0%        { transform: scale(1); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      2.5% { transform: scale(1.5); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      6.94%, 100% { transform: scale(1); }
    }
    @keyframes pop-s {
      0%        { transform: scale(1); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      2.78% { transform: scale(1.1); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      7.78%, 100% { transform: scale(1); }
    }
    @keyframes ping {
      0%         { transform: scale(1); opacity: 0.9; animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      13.89%, 100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes write {
      0%        { stroke-dashoffset: 100; animation-timing-function: cubic-bezier(0.2, 0, 0, 1); }
      8.33%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes shake {
      0%, 5%, 100% { transform: translateX(0); }
      0.97%  { transform: translateX(4px); }
      1.94% { transform: translateX(-4px); }
      2.92% { transform: translateX(3px); }
      3.89% { transform: translateX(-2px); }
    }
    @keyframes spin {
      0%        { transform: rotate(0deg); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      12.5%, 100% { transform: rotate(360deg); }
    }
    @keyframes breathe { 50% { opacity: 0.5; } }
    @media (prefers-reduced-motion: reduce) {
      .pkt, .ping, .sweep { display: none; }
      .emit, .pop, .pop-s, .write, .shake, .spin, .breathe { animation: none; }
    }
  </style>

  <g stroke="#6b7391" stroke-width="1" opacity="0.9">
    <line x1="70" y1="160" x2="165" y2="160"/>
    <line x1="165" y1="160" x2="260" y2="160"/>
    <line x1="260" y1="160" x2="333" y2="160"/>
    <line x1="387" y1="160" x2="480" y2="160"/>
    <line x1="480" y1="160" x2="568" y2="160"/>
  </g>
  <g>
    <line class="pkt" pathLength="100" style="--d:.40s" x1="70" y1="160" x2="165" y2="160"/>
    <line class="pkt" pathLength="100" style="--d:1.15s" x1="165" y1="160" x2="260" y2="160"/>
    <line class="pkt" pathLength="100" style="--d:1.90s" x1="260" y1="160" x2="333" y2="160"/>
    <line class="pkt" pathLength="100" style="--d:3.70s" x1="260" y1="160" x2="333" y2="160"/>
    <line class="pkt" pathLength="100" style="--d:4.45s" x1="387" y1="160" x2="480" y2="160"/>
    <line class="pkt" pathLength="100" style="--d:5.20s" x1="480" y1="160" x2="568" y2="160"/>
  </g>

  <g fill="#696fb4" opacity="0.85">
    <circle class="emit" cx="70" cy="160" r="7"/>
    <circle class="pop" style="--d:1.00s" cx="165" cy="160" r="7"/>
    <g class="pop" style="--d:3.55s"><circle class="pop" style="--d:1.75s" cx="260" cy="160" r="7"/></g>
    <circle class="pop" style="--d:5.05s" cx="480" cy="160" r="7"/>
  </g>

  <g class="shake" style="--d:2.55s">
    <rect x="336" y="136" width="48" height="48" rx="4" fill="none" stroke="#696fb4" stroke-width="2" transform="rotate(45 360 160)"/>
  </g>
  <g class="pop" style="--d:4.30s"><circle class="pop" style="--d:2.50s" cx="360" cy="160" r="5" fill="#696fb4"/></g>

  <circle class="pop" style="--d:5.80s" cx="575" cy="160" r="12" fill="none" stroke="#696fb4" stroke-width="2"/>
  <circle class="ping" style="--d:5.80s" cx="575" cy="160" r="12" fill="none" stroke="#696fb4" stroke-width="2"/>
  <circle class="breathe" cx="575" cy="160" r="5" fill="#696fb4"/>

  <path d="M 360 196 L 360 260 L 260 260 L 260 175" fill="none" stroke="#6b7391" stroke-width="1.5" opacity="0.9" stroke-dasharray="5 5"/>
  <path class="pkt l" pathLength="100" style="--d:2.75s" d="M 360 196 L 360 260 L 260 260 L 260 175"/>
  <path d="M 254 188 L 260 173 L 266 188" fill="none" stroke="#696fb4" stroke-width="1.5" opacity="0.9" stroke-linecap="round"/>

  <g stroke="#6b7391" stroke-width="1" opacity="0.7" stroke-linecap="round">
    <line x1="70" y1="310" x2="575" y2="310"/>
    <line x1="70" y1="304" x2="70" y2="316"/>
    <line x1="575" y1="304" x2="575" y2="316"/>
  </g>
</svg>
