<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="A video avatar branching a conversation into three segment paths">


  <rect x="70" y="90" width="150" height="180" rx="10" fill="none" stroke="#696fb4" stroke-width="2"/>
  <circle cx="145" cy="155" r="26" fill="none" stroke="#696fb4" stroke-width="2"/>
  <path d="M 105 240 C 105 205, 185 205, 185 240" fill="none" stroke="#696fb4" stroke-width="2"/>
  <circle cx="196" cy="106" r="5" fill="#696fb4">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#6b7391" stroke-width="1" opacity="0.9">
    <path d="M 220 180 C 300 180, 320 80, 400 80" fill="none"/>
    <path d="M 220 180 L 400 180" fill="none"/>
    <path d="M 220 180 C 300 180, 320 280, 400 280" fill="none"/>
  </g>

  <g fill="#696fb4">
    <circle cx="400" cy="80" r="7"/>
    <circle cx="400" cy="180" r="7"/>
    <circle cx="400" cy="280" r="7"/>
  </g>

  <g stroke="#6b7391" stroke-width="1" opacity="0.9">
    <line x1="70" y1="60" x2="220" y2="60"/>
    <line x1="70" y1="60" x2="70" y2="90"/>
  </g>
</svg>
