  <text x="260" y="240" fill="#9aa2bd" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" letter-spacing="1">ENQUEUE</text>

  <line x1="305" y1="180" x2="360" y2="180" stroke="#8b9dff" stroke-width="1" opacity="0.5"/>

  <g fill="none" stroke="#8b9dff" stroke-width="2">
    <ellipse cx="405" cy="140" rx="38" ry="11"/>
    <path d="M 367 140 L 367 205 A 38 11 0 0 0 443 205 L 443 140"/>
  </g>
  <text x="405" y="245" fill="#9aa2bd" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" letter-spacing="1">JOB STORE</text>

  <line x1="443" y1="175" x2="500" y2="175" stroke="#8b9dff" stroke-width="1" opacity="0.5"/>

  <rect x="510" y="145" width="90" height="60" rx="6" fill="none" stroke="#8b9dff" stroke-width="2"/>
