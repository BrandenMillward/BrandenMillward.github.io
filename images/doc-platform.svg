    <path d="M 60 120 L 130 120 L 130 240 L 60 240 Z"/>
    <path d="M 108 120 L 108 142 L 130 142"/>
  </g>
  <g stroke="#8b9dff" stroke-width="2" opacity="0.6" stroke-linecap="round">
    <line x1="75" y1="165" x2="115" y2="165"/>
    <line x1="75" y1="185" x2="108" y2="185"/>
    <line x1="75" y1="205" x2="115" y2="205"/>
  </g>
  <text x="95" y="270" fill="#9aa2bd" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle" letter-spacing="2">SOURCE</text>

  <line x1="150" y1="180" x2="205" y2="180" stroke="#8b9dff" stroke-width="1" opacity="0.5"/>

