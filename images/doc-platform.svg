<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="A document flowing through an asynchronous pipeline of API, worker, and job store">
  <rect width="640" height="360" fill="#0f1220"/>

