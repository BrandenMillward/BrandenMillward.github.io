  <path d="M 537 168 L 537 175 L 543 179" fill="none" stroke="#8b9dff" stroke-width="2" stroke-linecap="round"/>
  <text x="572" y="181" fill="#8b9dff" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" letter-spacing="1">∞</text>
  <text x="555" y="235" fill="#9aa2bd" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" letter-spacing="1">WORKER · NO TIMEOUT</text>

  <path d="M 555 145 C 555 100, 405 90, 320 90 C 285 90, 268 110, 262 148" fill="none" stroke="#8b9dff" stroke-width="1" stroke-dasharray="4 5" opacity="0.55"/>
  <text x="405" y="72" fill="#9aa2bd" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" letter-spacing="2">POLL STATUS</text>
