<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="A phone recording sampled into frames and read in parallel batches, feeding a report and a stack of tailored slides">

  <!-- The recording is sampled into frames, batches are read in parallel, then the report writes itself and the slides land. -->
  <style>
    /* Motion is decoration: under reduced motion every rule below switches off and the
       diagram is exactly as authored. Generated by scripts/animate-covers.js, edit there.
       .pkt    a streak riding a duplicate of a connector (pathLength=100)
       .emit   source winds up, then releases
       .pop    node reacts as a packet lands (.pop-s for large shapes)
       .ping   copy of an output ring that expands and fades
       .write  stroke redraws left to right (pathLength=100)
       .shake  a flagged gap
       .spin   one eased turn, origin set inline
       .breathe ambient, the only part with no delay */
    .pkt {
      fill: none; stroke: #696fb4; stroke-width: 4; stroke-linecap: round;
      stroke-dasharray: 0 200; opacity: 0;
      animation: hop 4.8s var(--d, 0s) infinite both;
    }
    .pkt.l { animation-name: hop-l; }
    .emit, .pop, .pop-s, .ping, .shake { transform-box: fill-box; transform-origin: center; }
    .emit  { animation: emit 4.8s var(--d, 0s) infinite both; }
    .pop   { animation: pop 4.8s var(--d, 0s) infinite both; }
    .pop-s { animation: pop-s 4.8s var(--d, 0s) infinite both; }
    .ping  { opacity: 0; animation: ping 4.8s var(--d, 0s) infinite both; }
    .write { stroke-dasharray: 100 100; animation: write 4.8s var(--d, 0s) infinite both; }
    .shake { animation: shake 4.8s var(--d, 0s) infinite both; }
    .spin  { transform-box: view-box; animation: spin 4.8s var(--d, 0s) infinite both; }
    .breathe { animation: breathe 4.8s ease-in-out infinite; }
    
    @keyframes hop {
      0%       { stroke-dasharray: 0 200; stroke-dashoffset: 0; opacity: 0; animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      0.42% { opacity: 1; }
      3.75% { stroke-dasharray: 30 200; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      12.5% { stroke-dasharray: 30 200; stroke-dashoffset: -70; opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      15.83%, 100% { stroke-dasharray: 0 200; stroke-dashoffset: -100; opacity: 0; }
    }
    
    @keyframes hop-l {
      0%       { stroke-dasharray: 0 200; stroke-dashoffset: 0; opacity: 0; animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      0.42% { opacity: 1; }
      5% { stroke-dasharray: 30 200; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      16.67% { stroke-dasharray: 30 200; stroke-dashoffset: -70; opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      20%, 100% { stroke-dasharray: 0 200; stroke-dashoffset: -100; opacity: 0; }
    }
    @keyframes emit {
      0%        { transform: scale(1); animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      5% { transform: scale(0.85); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      8.75% { transform: scale(1.15); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      14.58%, 100% { transform: scale(1); }
    }
    @keyframes pop {
      0%        { transform: scale(1); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      3.75% { transform: scale(1.5); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      10.42%, 100% { transform: scale(1); }
    }
    @keyframes pop-s {
      0%        { transform: scale(1); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      4.17% { transform: scale(1.1); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      11.67%, 100% { transform: scale(1); }
    }
    @keyframes ping {
      0%         { transform: scale(1); opacity: 0.9; animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
      20.83%, 100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes write {
      0%        { stroke-dashoffset: 100; animation-timing-function: cubic-bezier(0.2, 0, 0, 1); }
      12.5%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes shake {
      0%, 7.5%, 100% { transform: translateX(0); }
      1.46%  { transform: translateX(4px); }
      2.92% { transform: translateX(-4px); }
      4.38% { transform: translateX(3px); }
      5.83% { transform: translateX(-2px); }
    }
    @keyframes spin {
      0%        { transform: rotate(0deg); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      18.75%, 100% { transform: rotate(360deg); }
    }
    @keyframes breathe { 50% { opacity: 0.5; } }
    @media (prefers-reduced-motion: reduce) {
      .pkt, .ping, .sweep { display: none; }
      .emit, .pop, .pop-s, .write, .shake, .spin, .breathe { animation: none; }
    }
  </style>

  <rect class="emit" style="--d:0s" x="56" y="100" width="72" height="140" rx="12" fill="none" stroke="#696fb4" stroke-width="2"/>
  <line x1="80" y1="112" x2="104" y2="112" stroke="#6b7391" stroke-width="2" stroke-linecap="round"/>

  <g stroke="#6b7391" stroke-width="1" opacity="0.9">
    <line x1="128" y1="170" x2="170" y2="120"/>
    <line x1="128" y1="170" x2="170" y2="170"/>
    <line x1="128" y1="170" x2="170" y2="220"/>
    <line x1="246" y1="120" x2="300" y2="170"/>
    <line x1="246" y1="170" x2="300" y2="170"/>
    <line x1="246" y1="220" x2="300" y2="170"/>
    <line x1="340" y1="170" x2="420" y2="110"/>
    <line x1="340" y1="170" x2="420" y2="240"/>
  </g>
  <g>
    <line class="pkt" pathLength="100" style="--d:.30s" x1="128" y1="170" x2="170" y2="120"/>
    <line class="pkt" pathLength="100" style="--d:.38s" x1="128" y1="170" x2="170" y2="170"/>
    <line class="pkt" pathLength="100" style="--d:.46s" x1="128" y1="170" x2="170" y2="220"/>
    <line class="pkt" pathLength="100" style="--d:1.20s" x1="246" y1="120" x2="300" y2="170"/>
    <line class="pkt" pathLength="100" style="--d:1.28s" x1="246" y1="170" x2="300" y2="170"/>
    <line class="pkt" pathLength="100" style="--d:1.36s" x1="246" y1="220" x2="300" y2="170"/>
    <line class="pkt" pathLength="100" style="--d:2.10s" x1="340" y1="170" x2="420" y2="110"/>
    <line class="pkt" pathLength="100" style="--d:2.18s" x1="340" y1="170" x2="420" y2="240"/>
  </g>

  <g fill="none" stroke="#696fb4" stroke-width="1.5">
    <rect class="pop" style="--d:.80s" x="170" y="110" width="20" height="20" rx="2"/>
    <rect class="pop" style="--d:.84s" x="198" y="110" width="20" height="20" rx="2"/>
    <rect class="pop" style="--d:.88s" x="226" y="110" width="20" height="20" rx="2"/>
    <rect class="pop" style="--d:.88s" x="170" y="160" width="20" height="20" rx="2"/>
    <rect class="pop" style="--d:.92s" x="198" y="160" width="20" height="20" rx="2"/>
    <rect class="pop" style="--d:.96s" x="226" y="160" width="20" height="20" rx="2"/>
    <rect class="pop" style="--d:.96s" x="170" y="210" width="20" height="20" rx="2"/>
    <rect class="pop" style="--d:1.00s" x="198" y="210" width="20" height="20" rx="2"/>
    <rect class="pop" style="--d:1.04s" x="226" y="210" width="20" height="20" rx="2"/>
  </g>

  <circle class="ping" style="--d:1.75s" cx="320" cy="170" r="20" fill="none" stroke="#696fb4" stroke-width="2"/>
  <circle class="pop-s" style="--d:1.75s" cx="320" cy="170" r="20" fill="none" stroke="#696fb4" stroke-width="2"/>
  <circle class="breathe" cx="320" cy="170" r="7" fill="#696fb4"/>

  <rect class="pop-s" style="--d:2.70s" x="420" y="60" width="110" height="100" rx="6" fill="none" stroke="#696fb4" stroke-width="2"/>
  <g stroke="#6b7391" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line class="write" pathLength="100" style="--d:2.80s" x1="436" y1="84" x2="514" y2="84"/>
    <line class="write" pathLength="100" style="--d:2.88s" x1="436" y1="104" x2="500" y2="104"/>
    <line class="write" pathLength="100" style="--d:2.96s" x1="436" y1="124" x2="508" y2="124"/>
    <line class="write" pathLength="100" style="--d:3.04s" x1="436" y1="144" x2="490" y2="144"/>
  </g>

  <g fill="none" stroke="#6b7391" stroke-width="1.5">
    <rect x="452" y="196" width="112" height="70" rx="4"/>
    <rect x="436" y="208" width="112" height="70" rx="4"/>
  </g>
  <rect class="pop-s" style="--d:2.85s" x="420" y="220" width="112" height="70" rx="4" fill="none" stroke="#696fb4" stroke-width="2"/>
</svg>
